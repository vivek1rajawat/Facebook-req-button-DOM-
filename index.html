<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Button</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="card">
        <img src="https://images7.alphacoders.com/130/thumb-1920-1300590.png" alt="">
        <h1>Naruto Uzumaki</h1>
        <h5>Stranger</h5>
        <div id="btn-container">
            <button id="add">Add Friend</button>
        </div>
    </div>

    <!-- Ek Paigam Dil Se Section -->
    <div id="password-section">
        <h2>Ek Paigam Dil Se</h2>
        <p>Tum Meri Wajah Ho - Enter password to see the message</p>
        <div id="password-container">
            <input type="password" id="password-input" placeholder="Enter password">
            <button id="unlock-btn">Unlock</button>
        </div>
        <div id="letter-box" style="display: none;">
            <h3>Hidden Message:</h3>
            <p>This is the secret message that was hidden behind the password!</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
